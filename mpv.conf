# Video
profile=high-quality
vo=gpu-next
scale-antiring=0.6

hwdec=auto
dither-depth = 8 # Match display bit-depth

# Screenshots
screenshot-format=png
screenshot-dir="~/Pictures/Screenshots/mpv"
screenshot-template="%F-%p-%n"
screenshot-high-bit-depth=no

# Misc
keep-open=yes
save-position=on=quit=yes
volume-max=100

# Language Priority
slang=eng,en
alang=jpn,ja

# Disable default binds
no-input-default-bindings

# Scripts
no-osc
no-window-dragging

osc=no
border=no

osd-bar=no

[Manga]
profile-desc="Read Manga"
profile-cond=filename and filename:match('%.cbz$') or filename:match('%.cbr$') or filename:match('%.zip$') or filename:match('%.rar$') ~= nil
profile=high-quality
dscale=mitchell
deband=no
